<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Mammoth Sea Battles · layout A mock-up</title>
  </head>
  <body>
    <div id="app" class="programming">
      <main id="table">
        <div id="labels"></div>
        <div class="topbar">
          <button class="btn" id="menu-btn" aria-label="Menu"><span class="i">☰</span> Menu</button>
          <div id="status" class="pill"></div>
        </div>
        <section id="rivals" class="panel"></section>
        <section id="weather" class="panel"></section>
        <section id="crew" class="panel"></section>
        <nav id="viewctl">
          <button class="btn sq" data-v="in" aria-label="Zoom in">+</button>
          <button class="btn sq" data-v="out" aria-label="Zoom out">−</button>
          <button class="btn sq" data-v="home" aria-label="Whole board">⤢</button>
          <button class="btn sq" data-v="me" aria-label="Centre on my ship">◎</button>
          <button class="btn sq" data-v="overlays" aria-label="Show or hide markings">◐</button>
        </nav>
        <section id="inspect" class="panel" hidden></section>
        <div id="toast" hidden></div>
      </main>
      <footer id="dock">
        <div id="board-col">
          <div id="switcher" hidden></div>
          <div id="shipboard"></div>
        </div>
        <div id="hand"></div>
        <div id="actions">
          <button class="btn primary" id="ready"><span class="i">✓</span> Ready</button>
          <button class="btn" id="undo">Undo</button>
          <button class="btn" id="clear">Clear</button>
          <div class="row2">
            <button class="btn toggle on" id="ghost" aria-pressed="true">Ghost</button>
            <button class="btn toggle" id="spread" aria-pressed="false">Spread</button>
          </div>
        </div>
      </footer>
      <footer id="playback" hidden></footer>
      <div id="tray" hidden></div>
      <aside id="menu" hidden></aside>
      <div id="modal" hidden></div>
      <div id="drag-layer"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
